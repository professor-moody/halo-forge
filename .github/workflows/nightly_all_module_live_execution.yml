name: Nightly All-Module Live Execution

on:
  schedule:
    - cron: "35 7 * * *"
  workflow_dispatch:

jobs:
  strict-all-module-live-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Strict all-module live execution gate
        run: |
          python3 scripts/run_all_module_live_matrix.py \
            --live-profile live-smoke-v1 \
            --strict \
            --write-report \
            --report-file results/readiness/all_module_live_execution.v1.json
