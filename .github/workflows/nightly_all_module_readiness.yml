name: Nightly All-Module Readiness

on:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:

jobs:
  strict-all-module-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Strict fixture-backed all-module readiness gate
        run: |
          python3 scripts/run_all_module_matrix.py \
            --fixture-pack v1 \
            --strict \
            --write-report \
            --report-file results/readiness/all_modules_readiness.v1.json
