name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-core-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Syntax compile check
        run: python -m compileall -q halo_forge ui tests

      - name: Modality baseline drift guard
        run: |
          python3 scripts/generate_modality_baseline.py \
            --baseline-file tests/baselines/modality_runtime_baseline.v1.json \
            --check

      - name: Core framework and UI regression checks
        run: |
          pytest -q \
            tests/test_pipeline.py \
            tests/test_verifiers.py \
            tests/test_inference.py \
            tests/test_agentic.py \
            tests/test_audio.py \
            tests/test_reasoning.py \
            tests/test_vlm.py \
            tests/test_phase0_stabilization.py \
            tests/test_phase1_hardening.py \
            tests/test_phase2_consistency_cleanup.py \
            tests/test_phase3_truth_in_advertising.py \
            tests/test_phase4_ui_observability_consolidation.py \
            tests/test_phase5_release_engineering.py \
            tests/test_core_functionality_matrix.py \
            tests/test_benchmark_results_trust_matrix.py \
            tests/test_training_pipeline_contracts.py \
            tests/test_dependency_packaging_contracts.py \
            tests/test_runtime_surface_alignment.py \
            tests/test_phase6_modality_graduation.py \
            tests/test_phase7_modality_reliability_gates.py \
            tests/test_phase7b_modality_e2e_surface.py \
            tests/test_phase7c_modality_baseline_drift.py \
            tests/test_phase8_ui_ops_parity_relaunch.py \
            tests/test_phase9_non_code_modality_research_matrix.py
