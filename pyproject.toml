[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "halo-forge"
version = "1.3.0"
description = "Multi-backend RLVR training framework for AMD ROCm, Apple Silicon, and CUDA"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "halo-forge contributors"}
]
requires-python = ">=3.10,<3.14"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "llm",
    "fine-tuning",
    "rlvr",
    "raft",
    "amd",
    "strix-halo",
    "rocm",
    "cuda",
    "apple-silicon",
    "mps",
    "mlx",
]

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.49.0",
    "peft>=0.13.0",
    "datasets>=2.14.0,<4.0.0",
    "trl>=0.12.0",
    "accelerate",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "tqdm",
    "jsonlines",
    "tensorboard",
    "matplotlib",
    "pandas",
    "rich",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
# Dependency contract:
# - `project.dependencies` is the baseline runtime contract for `pip install .`.
# - Optional groups below are the supported modality/install profiles.
# - `requirements.txt` remains a convenience mirror and must stay in sync.
dev = [
    "pytest",
    "black",
    "isort",
]
llm-backends = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
]
# vlmeval (open-compass/VLMEvalKit) is github-only — no PyPI release.
# Users who want VLM benchmarking install it directly:
#     pip install git+https://github.com/open-compass/VLMEvalKit.git
# The benchmark module does a lazy import and surfaces a clear error if
# missing, so leaving it out of the extra is safe.
benchmark = []
# Backward-compatible alias for existing docs/scripts.
vlm-benchmark = []
vlm = [
    "qwen-vl-utils",
    "ultralytics",
    "easyocr",
]
audio = [
    "openai-whisper",
    "torchaudio>=2.0.0",
    "librosa",
    "jiwer>=3.0.0",
    "soundfile",
]
reasoning = [
    "sympy>=1.12",
]
# Agentic training currently relies on baseline dependencies only.
agentic = []
inference = [
    "bitsandbytes",
    "scipy",
    "sentencepiece",
    "protobuf",
    "einops",
]
# Apple MLX backend. Inference-only in Phase 3; Phase 4-5 add LoRA SFT and RAFT.
# Apple Silicon only (mlx wheels are arm64 macOS).
mlx = [
    "mlx>=0.18.0,<0.30.0",
    "mlx-lm>=0.20.0,<0.30.0",
]
all = [
    "halo-forge[dev,llm-backends,benchmark,vlm-benchmark,vlm,audio,reasoning,agentic,inference]",
]

[project.scripts]
halo-forge = "halo_forge.cli:main"

[project.urls]
Homepage = "https://github.com/professor-moody/halo-forge"
Documentation = "https://github.com/professor-moody/halo-forge/tree/main/docs"
Repository = "https://github.com/professor-moody/halo-forge"

[tool.setuptools.packages.find]
where = ["."]
include = ["halo_forge*", "ui*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100
