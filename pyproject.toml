[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "halo-forge"
version = "2.0.0a2"
description = "Multi-backend RLVR training framework for AMD ROCm, Apple Silicon, and CUDA"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "halo-forge contributors"}
]
requires-python = ">=3.10,<3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "llm",
    "fine-tuning",
    "rlvr",
    "raft",
    "amd",
    "strix-halo",
    "rocm",
    "cuda",
    "apple-silicon",
    "mps",
    "mlx",
]

dependencies = [
    "numpy>=1.24.0,<3.0.0",
    "torch>=2.1.0,<3.0.0",
    "transformers>=4.49.0,<6.0.0",
    "peft>=0.13.0,<1.0.0",
    "datasets>=2.14.0,<4.0.0",
    "trl>=0.12.0,<1.0.0",
    "accelerate>=0.26.0,<2.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "tqdm",
    "jsonlines",
    "tensorboard",
    "pandas",
    "rich",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.34.0,<1.0.0",
    "keyring>=25.0.0,<26.0.0",
]

[project.optional-dependencies]
# Dependency contract:
# - `project.dependencies` is the baseline runtime contract for `pip install .`.
# - Optional groups below are the supported modality/install profiles.
# - `requirements.txt` remains a convenience mirror and must stay in sync.
dev = [
    "pytest",
    "httpx",
    "psutil",
    "Pillow>=10.0.0",
    "jsonschema",
    "pypdf>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "python-docx>=1.1.0",
    "pyinstaller>=6.0.0,<7.0.0",
    "black",
    "isort",
    "ruff",
]
llm-backends = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
]
# vlmeval (open-compass/VLMEvalKit) is github-only — no PyPI release.
# Users who want VLM benchmarking install it directly:
#     pip install git+https://github.com/open-compass/VLMEvalKit.git
# The benchmark module does a lazy import and surfaces a clear error if
# missing, so leaving it out of the extra is safe.
benchmark = []
# Backward-compatible alias for existing docs/scripts.
vlm-benchmark = []
vlm = [
    "qwen-vl-utils",
    "ultralytics",
    "easyocr",
]
audio = [
    "openai-whisper",
    "torchaudio>=2.0.0",
    "librosa",
    "jiwer>=3.0.0",
    "soundfile",
]
reasoning = [
    "sympy>=1.12",
]
# Charting for `halo-forge plot ...` and the scripts/ plotting helpers. Nothing
# in `halo_forge` or `ui` imports matplotlib; the scripts lazy-import it and
# print an install hint, and `all_module_live_execution` already classifies it
# as an optional dependency of the "plot" module.
plot = [
    "matplotlib",
]
# Agentic training currently relies on baseline dependencies only.
agentic = []
data-lab = [
    "Pillow>=10.0.0",
    "pyarrow>=14.0.0",
    "sentence-transformers>=3.0.0",
]
corpus = [
    "beautifulsoup4>=4.12.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]
inference = [
    "bitsandbytes",
    "scipy",
    "sentencepiece",
    "protobuf",
    "einops",
]
# Apple MLX backend. Apple Silicon only (mlx wheels are arm64 macOS).
# Keep this on the measured compatibility line; older 0.29.x wheels can abort
# during Metal initialization on macOS 26.x before Python can surface an error.
mlx = [
    "mlx>=0.31.0,<0.32.0",
    "mlx-lm>=0.31.0,<0.32.0",
]
all = [
    "halo-forge[dev,llm-backends,benchmark,vlm-benchmark,vlm,audio,reasoning,plot,agentic,data-lab,corpus,inference]",
]

[project.scripts]
halo-forge = "halo_forge.cli:main"
halo-forge-desktop-runtime = "halo_forge.desktop_runtime:main"

[project.urls]
Homepage = "https://github.com/professor-moody/halo-forge"
Documentation = "https://halo-forge.io/docs/"
Repository = "https://github.com/professor-moody/halo-forge"

[tool.setuptools.packages.find]
where = ["."]
include = ["halo_forge*", "ui*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100
